<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP im Webshop: Tools leben in der Seite, das Modell bleibt im Browser-Agent</title>
  <desc id="desc">Im Browser laufen zwei getrennte Dinge: ein Browser-Agent mit eigenem Sprachmodell, der getTools() und executeTool() kennt, und die geöffnete Webshop-Seite, in der WebMCP-Tools über document.modelContext.registerTool() registriert sind. Der Aufruf vom Agent zu den Tools bleibt vollständig im Browser, kein Netzwerk nötig. Erst wenn ein Tool ausgeführt wird, verlässt ein echter Netzwerk-Request den Browser: ein fetch() mit Session-Cookie an die Web-API unseres App-Servers, der an denselben Shop-Handler und Zustand wie die normale Web-UI delegiert. Das Tool-Resultat löst im Browser das Event shop:cart-changed aus, worauf die Shop-UI ohne Reload neu lädt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #64748b; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .label { font-size: 19px; fill: #475569; }
      .group { font-size: 17px; font-weight: 700; fill: #64748b; letter-spacing: 1.5px; }
      .note { font-size: 18px; font-weight: 600; fill: #0f766e; }
      .net-label { font-size: 18px; font-weight: 600; fill: #b91c1c; }
      .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 18px; fill: #475569; }
      .badge-text { font-size: 17px; font-weight: 700; fill: #fff; letter-spacing: 0.5px; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .line-local { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 3 7; stroke-linecap: round; marker-end: url(#arrow-local); }
      .line-net { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow-net); }
      .app { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .model { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .server { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; }
      .badge-net { fill: #dc2626; }
      .legend { fill: #fff; stroke: #e2e8f0; stroke-width: 2; }
      .merke { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1760" height="900" fill="#fff"/>
  <text x="880" y="46" text-anchor="middle" class="title">WebMCP im Webshop</text>
  <text x="880" y="78" text-anchor="middle" class="subtitle">Nur der Aufruf gegen unseren Server ist ein echter Netzwerk-Request</text>

  <!-- Browser: Agent + geöffnete Seite -->
  <rect x="60" y="110" width="760" height="630" rx="20" class="boundary"/>
  <text x="84" y="143" class="group">BROWSER · EIN TAB + BROWSER-AGENT</text>

  <rect x="90" y="170" width="700" height="140" rx="16" class="model" filter="url(#shadow)"/>
  <text x="440" y="208" text-anchor="middle" class="heading">Browser-Agent</text>
  <text x="440" y="240" text-anchor="middle" class="body">Sprachmodell im Browser oder in einer Extension</text>
  <text x="440" y="266" text-anchor="middle" class="label">kennt getTools() und executeTool()</text>
  <text x="440" y="292" text-anchor="middle" class="label">unser Server liefert keinen Modellzugang dafür</text>

  <path d="M 440 312 V 366" class="line-local"/>
  <text x="460" y="346" class="label" style="font-size:18px">getTools() / executeTool() · kein Netzwerk</text>

  <rect x="90" y="370" width="700" height="340" rx="16" class="app" filter="url(#shadow)"/>
  <text x="440" y="406" text-anchor="middle" class="heading">Geöffnete Webshop-Seite (Tab)</text>
  <text x="440" y="433" text-anchor="middle" class="label">Tools und UI laufen im selben Dokument</text>

  <rect x="120" y="455" width="640" height="105" rx="14" class="server"/>
  <text x="440" y="487" text-anchor="middle" class="heading">WebMCP-Tools</text>
  <text x="440" y="515" text-anchor="middle" class="code">document.modelContext.registerTool(...)</text>
  <text x="440" y="542" text-anchor="middle" class="label">gleiche Tool-Contracts wie Chat &amp; MCP · 6 Tools</text>

  <path d="M 440 562 V 596" class="line-local"/>
  <text x="462" y="586" class="note">Event</text>

  <rect x="120" y="600" width="640" height="80" rx="14" class="store"/>
  <text x="440" y="632" text-anchor="middle" class="heading">Shop-UI</text>
  <text x="440" y="662" text-anchor="middle" class="body">reagiert auf <tspan class="code" style="font-size:19px;fill:#172033">shop:cart-changed</tspan>, lädt Daten neu</text>

  <!-- Legende -->
  <rect x="1080" y="170" width="620" height="140" rx="16" class="legend"/>
  <path d="M 1110 205 H 1190" class="line-local"/>
  <text x="1212" y="211" class="label">Aufruf im Browser · kein Netzwerk</text>
  <path d="M 1110 240 H 1190" class="line-net"/>
  <text x="1212" y="246" class="label">echter Netzwerk-Request (HTTP)</text>
  <path d="M 1110 275 H 1190" class="line"/>
  <text x="1212" y="281" class="label">Aufruf innerhalb des Servers</text>

  <!-- Unser App-Server -->
  <rect x="1080" y="360" width="620" height="380" rx="20" class="boundary"/>
  <text x="1104" y="393" class="group">UNSER APP-SERVER</text>

  <rect x="1110" y="420" width="560" height="150" rx="16" class="app" filter="url(#shadow)"/>
  <text x="1390" y="456" text-anchor="middle" class="heading">Web-API</text>
  <text x="1390" y="485" text-anchor="middle" class="code">/api/search · /api/cart · /api/checkout</text>
  <text x="1390" y="513" text-anchor="middle" class="label">gleiche Endpunkte wie Chat- und MCP-Tools</text>
  <text x="1390" y="540" text-anchor="middle" class="label">prüft Session-Cookie statt loginId</text>

  <path d="M 1390 570 V 608" class="line"/>

  <rect x="1110" y="610" width="560" height="100" rx="16" class="store" filter="url(#shadow)"/>
  <text x="1390" y="643" text-anchor="middle" class="heading">Shop-Handler + Zustand</text>
  <text x="1390" y="671" text-anchor="middle" class="body">In-Memory Warenkorb und Bestellungen</text>
  <text x="1390" y="696" text-anchor="middle" class="label">gemeinsam mit MCP-Server &amp; normaler Web-UI</text>

  <!-- Netzwerk-Aufruf: einziger echter Request, Ziel ist der Web-API-Block -->
  <rect x="855" y="410" width="190" height="34" rx="17" class="badge-net"/>
  <text x="950" y="433" text-anchor="middle" class="badge-text">Netzwerk-Aufruf</text>

  <text x="950" y="475" text-anchor="middle" class="net-label">fetch() · Session-Cookie</text>
  <path d="M 760 487 H 1108" class="line-net"/>
  <path d="M 1110 528 H 762" class="line-net"/>
  <text x="950" y="556" text-anchor="middle" class="net-label">JSON-Resultat</text>

  <!-- Merksatz -->
  <rect x="60" y="770" width="1640" height="100" rx="14" class="merke"/>
  <text x="90" y="810" class="label"><tspan style="font-weight:700;fill:#b45309">Merke:</tspan> Das Sprachmodell steckt im Browser-Agent, die Tools stecken in der geöffneten Seite — beides ausserhalb unseres Servers.</text>
  <text x="90" y="840" class="label">Nur der Aufruf der Tools gegen unsere Web-API ist ein echter Netzwerk-Request; der Aufruf vom Agent zu den Tools bleibt im Browser.</text>
</svg>
